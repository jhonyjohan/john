<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>John - Tu Asistente con IA</title>
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1a0913">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #180914 0%, #2a081a 50%, #12030d 100%);
      --accent-color: #ff4d79;
      --accent-glow: rgba(255, 77, 121, 0.45);
      --glass-bg: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.14);
      --text-main: #fff0f5;
      --text-muted: #d9b3c7;
      --card-radius: 24px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 20px 20px calc(24px + env(safe-area-inset-bottom)) 20px;
    }

    .header {
      text-align: center;
      margin-top: 5px;
      width: 100%;
    }

    .badge {
      display: inline-block;
      padding: 5px 15px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 30px;
      font-size: 0.72rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--accent-color);
      margin-bottom: 6px;
    }

    .title {
      font-family: 'Playfair Display', serif;
      font-size: 2.1rem;
      font-weight: 600;
      background: linear-gradient(180deg, #ffffff 0%, #ffccd5 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 2px;
      font-weight: 300;
    }

    /* Tarjeta de Diálogo */
    .dialog-card {
      width: 100%;
      max-width: 360px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--card-radius);
      padding: 24px 20px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
      text-align: center;
      position: relative;
    }

    .dialog-avatar {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #ff4d79, #991b3e);
      border-radius: 50%;
      margin: -50px auto 12px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      box-shadow: 0 8px 20px var(--accent-glow);
      border: 2px solid rgba(255, 255, 255, 0.4);
    }

    .dialog-message {
      font-size: 1.05rem;
      line-height: 1.5;
      color: var(--text-main);
      min-height: 55px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dialog-transcript {
      margin-top: 10px;
      font-size: 0.85rem;
      color: #ffccd5;
      font-style: italic;
      min-height: 18px;
    }

    /* Tarjeta de evento detectado por Gemini */
    .data-preview {
      margin-top: 15px;
      padding-top: 12px;
      border-top: 1px dashed var(--glass-border);
      display: none;
      text-align: left;
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .data-preview.active {
      display: block;
    }

    .data-item {
      margin-bottom: 5px;
      display: flex;
      justify-content: space-between;
    }

    .data-item strong {
      color: #fff;
    }

    .data-desc {
      margin-top: 5px;
      font-size: 0.78rem;
      color: #ffd1dc;
      line-height: 1.3;
    }

    /* Área del Micrófono */
    .voice-control-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 360px;
      margin-bottom: 15px;
    }

    .mic-button-wrapper {
      position: relative;
      width: 105px;
      height: 105px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pulse-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--accent-glow);
      opacity: 0;
      transform: scale(0.9);
      pointer-events: none;
    }

    .mic-button {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff4d79 0%, #b31245 100%);
      border: none;
      outline: none;
      color: white;
      font-size: 2.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 10px 25px var(--accent-glow);
      transition: all 0.25s ease;
      z-index: 2;
    }

    .mic-button:active {
      transform: scale(0.92);
    }

    .is-listening .pulse-ring {
      animation: pulseAnimation 1.5s infinite ease-out;
    }

    .is-listening .mic-button {
      background: linear-gradient(135deg, #ff1a53 0%, #ff7597 100%);
      box-shadow: 0 0 35px rgba(255, 26, 83, 0.9);
      transform: scale(1.05);
    }

    .is-thinking .mic-button {
      background: linear-gradient(135deg, #9b51e0 0%, #e056a0 100%);
      animation: rotateThinking 2s infinite linear;
    }

    @keyframes pulseAnimation {
      0% { transform: scale(0.9); opacity: 0.9; }
      100% { transform: scale(1.75); opacity: 0; }
    }

    @keyframes rotateThinking {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .mic-status-label {
      margin-top: 10px;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: center;
      min-height: 20px;
    }

    .input-row {
      display: flex;
      width: 100%;
      gap: 8px;
      margin-top: 12px;
    }

    .text-input {
      flex: 1;
      padding: 11px 16px;
      border-radius: 25px;
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
    }

    .btn-send {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--accent-color);
      border: none;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="badge">Tu novio con Inteligencia Artificial</div>
    <h1 class="title">John</h1>
    <p class="subtitle">Siempre pendiente de ti, mi flaquito hermoso</p>
  </header>

  <main class="dialog-card">
    <div class="dialog-avatar">❤️</div>
    <div class="dialog-message" id="johnText">
      ¡Hola mi flaquito hermoso! Aquí estoy para ti. Toca el micrófono y cuéntame: ¿cómo va tu día o qué necesitas agendar?
    </div>
    <div class="dialog-transcript" id="userTranscript"></div>

    <div class="data-preview" id="dataPreview">
      <div class="data-item"><span>Actividad:</span> <strong id="previewTitle">---</strong></div>
      <div class="data-item"><span>Fecha:</span> <strong id="previewDate">---</strong></div>
      <div class="data-item"><span>Hora:</span> <strong id="previewTime">---</strong></div>
      <div class="data-desc" id="previewDesc">---</div>
    </div>
  </main>

  <section class="voice-control-area">
    <div class="mic-button-wrapper" id="micWrapper">
      <div class="pulse-ring"></div>
      <button class="mic-button" id="micBtn" aria-label="Hablar con John">🎙️</button>
    </div>
    <div class="mic-status-label" id="micStatus">Toca el micrófono para hablar con John</div>

    <div class="input-row">
      <input type="text" id="manualInput" class="text-input" placeholder="O escríbeme aquí, mi amor...">
      <button class="btn-send" id="btnSend">➤</button>
    </div>
  </section>

  <script>
    // =========================================================================
    // PEGA AQUÍ TU URL COPIADA DE GOOGLE APPS SCRIPT (TERMINA EN /exec):
    // =========================================================================
    const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycby9s7qHYZrIHwWB3Ku4V9G8ygReLXtwCMTaUz5j8dwW4ABhlHLuftCxjy6CN_c83eQsgw/exec";

    // Memoria de la conversación activa
    const historialConversacion = [];

    const micBtn = document.getElementById('micBtn');
    const micWrapper = document.getElementById('micWrapper');
    const micStatus = document.getElementById('micStatus');
    const johnText = document.getElementById('johnText');
    const userTranscript = document.getElementById('userTranscript');
    const dataPreview = document.getElementById('dataPreview');
    const previewTitle = document.getElementById('previewTitle');
    const previewDate = document.getElementById('previewDate');
    const previewTime = document.getElementById('previewTime');
    const previewDesc = document.getElementById('previewDesc');
    const manualInput = document.getElementById('manualInput');
    const btnSend = document.getElementById('btnSend');

    // SÍNTESIS DE VOZ DE JOHN
    const synth = window.speechSynthesis;
    function hablarComoJohn(texto, callback) {
      if (synth.speaking) synth.cancel();

      johnText.innerText = texto;
      const utterance = new SpeechSynthesisUtterance(texto);
      utterance.lang = 'es-CO';
      utterance.rate = 0.95;
      utterance.pitch = 0.9;

      const voces = synth.getVoices();
      const vozHombre = voces.find(v => v.lang.startsWith('es') && (v.name.includes('Male') || v.name.includes('Jorge') || v.name.includes('Pablo') || v.name.includes('Carlos')));
      if (vozHombre) utterance.voice = vozHombre;

      micStatus.innerText = "John está hablando...";
      utterance.onend = () => {
        micStatus.innerText = "Toca para responderle a John";
        if (callback) callback();
      };
      utterance.onerror = () => {
        micStatus.innerText = "Toca para responderle a John";
      };

      synth.speak(utterance);
    }

    // MOTOR NATIVO DE RECONOCIMIENTO DE VOZ
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'es-CO';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        micWrapper.classList.add('is-listening');
        micStatus.innerText = "🔴 Escuchándote, habla mi vida...";
      };

      recognition.onresult = (event) => {
        micWrapper.classList.remove('is-listening');
        const resultado = event.results[0][0].transcript.trim();
        userTranscript.innerText = '"' + resultado + '"';
        enviarMensajeAJohnIA(resultado);
      };

      recognition.onerror = (event) => {
        micWrapper.classList.remove('is-listening');
        if (event.error === 'no-speech') {
          micStatus.innerText = "No te escuché hablar, amor. Vuelve a tocar.";
        } else {
          micStatus.innerText = "Toca para hablarme.";
        }
      };

      recognition.onend = () => {
        micWrapper.classList.remove('is-listening');
      };
    }

    micBtn.addEventListener('click', () => {
      if (synth.speaking) synth.cancel();
      if (recognition) {
        try {
          recognition.start();
        } catch (e) {
          recognition.stop();
        }
      }
    });

    function enviarTextoManual() {
      const txt = manualInput.value.trim();
      if (!txt) return;
      userTranscript.innerText = '"' + txt + '"';
      manualInput.value = '';
      enviarMensajeAJohnIA(txt);
    }
    btnSend.addEventListener('click', enviarTextoManual);
    manualInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') enviarTextoManual(); });

    // =========================================================================
    // COMUNICACIÓN CON LA IA DE JOHN (GEMINI)
    // =========================================================================
    function enviarMensajeAJohnIA(mensajeUsuario) {
      micWrapper.classList.add('is-thinking');
      micStatus.innerText = "John está pensando con amor...";

      // Fecha y hora local del dispositivo en formato ISO
      const fechaLocal = new Date().toISOString();

      const parametros = new URLSearchParams({
        mensaje: mensajeUsuario,
        historial: JSON.stringify(historialConversacion),
        fechaLocal: fechaLocal
      });

      fetch(`${URL_APPS_SCRIPT}?${parametros.toString()}`)
        .then(res => res.json())
        .then(data => {
          micWrapper.classList.remove('is-thinking');

          if (data.exito) {
            // Guardar en la memoria de la conversación
            historialConversacion.push({ rol: 'user', texto: mensajeUsuario });
            historialConversacion.push({ rol: 'john', texto: data.mensajeParaJohan });

            // Si Gemini estructuró el evento
            if (data.evento) {
              dataPreview.classList.add('active');
              previewTitle.innerText = data.evento.titulo || '---';
              previewDate.innerText = data.evento.fecha || '---';
              previewTime.innerText = data.evento.hora || '---';
              previewDesc.innerText = data.evento.descripcion || '';
            }

            // Si además ya lo agendó en Google Calendar
            if (data.eventoCreado) {
              micStatus.innerText = "✅ Evento agendado en tu Google Calendar";
            }

            // John habla con su respuesta inteligente
            hablarComoJohn(data.mensajeParaJohan, () => {
              // Si aún no está agendado pero John hizo una pregunta, reabre la escucha automáticamente
              if (!data.eventoCreado && recognition) {
                try { recognition.start(); } catch(e){}
              }
            });

          } else {
            hablarComoJohn("Mi amor, ocurrió un detalle: " + data.mensajeParaJohan);
          }
        })
        .catch(err => {
          micWrapper.classList.remove('is-thinking');
          console.error(err);
          hablarComoJohn("Mi vida, tuve un problema de conexión con el servidor. Revisa tu internet.");
        });
    }
  </script>
</body>
</html>
