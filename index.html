<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>John - Tu Asistente Personal</title>
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1a0913">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #180914 0%, #2a081a 50%, #12030d 100%);
      --accent-color: #ff4d79;
      --accent-glow: rgba(255, 77, 121, 0.45);
      --glass-bg: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.14);
      --text-main: #fff0f5;
      --text-muted: #d9b3c7;
      --card-radius: 24px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 18px 20px calc(20px + env(safe-area-inset-bottom)) 20px;
    }

    .header {
      text-align: center;
      margin-top: 5px;
      width: 100%;
    }

    .badge {
      display: inline-block;
      padding: 5px 15px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 30px;
      font-size: 0.72rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--accent-color);
      margin-bottom: 6px;
    }

    .title {
      font-family: 'Playfair Display', serif;
      font-size: 2.1rem;
      font-weight: 600;
      background: linear-gradient(180deg, #ffffff 0%, #ffccd5 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 2px;
      font-weight: 300;
    }

    /* Tarjeta de Conversación */
    .dialog-card {
      width: 100%;
      max-width: 360px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--card-radius);
      padding: 22px 18px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
      text-align: center;
      position: relative;
    }

    .dialog-avatar {
      width: 58px;
      height: 58px;
      background: linear-gradient(135deg, #ff4d79, #991b3e);
      border-radius: 50%;
      margin: -48px auto 10px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.7rem;
      box-shadow: 0 8px 20px var(--accent-glow);
      border: 2px solid rgba(255, 255, 255, 0.4);
    }

    .dialog-message {
      font-size: 1.02rem;
      line-height: 1.45;
      color: var(--text-main);
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dialog-transcript {
      margin-top: 10px;
      font-size: 0.85rem;
      color: #ffccd5;
      font-style: italic;
      min-height: 18px;
    }

    /* Cuadro de resumen del evento */
    .data-preview {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px dashed var(--glass-border);
      display: none;
      text-align: left;
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .data-preview.active {
      display: block;
    }

    .data-item {
      margin-bottom: 5px;
      display: flex;
      justify-content: space-between;
    }

    .data-item strong {
      color: #fff;
    }

    /* Controles de Micrófono */
    .voice-control-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 360px;
    }

    .mic-button-wrapper {
      position: relative;
      width: 105px;
      height: 105px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pulse-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--accent-glow);
      opacity: 0;
      transform: scale(0.9);
      pointer-events: none;
    }

    .mic-button {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff4d79 0%, #b31245 100%);
      border: none;
      outline: none;
      color: white;
      font-size: 2.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 10px 25px var(--accent-glow);
      transition: all 0.25s ease;
      z-index: 2;
    }

    .mic-button:active {
      transform: scale(0.92);
    }

    .is-listening .pulse-ring {
      animation: pulseAnimation 1.5s infinite ease-out;
    }

    .is-listening .mic-button {
      background: linear-gradient(135deg, #ff1a53 0%, #ff7597 100%);
      box-shadow: 0 0 35px rgba(255, 26, 83, 0.9);
      transform: scale(1.05);
    }

    @keyframes pulseAnimation {
      0% { transform: scale(0.9); opacity: 0.9; }
      100% { transform: scale(1.75); opacity: 0; }
    }

    .mic-status-label {
      margin-top: 10px;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: center;
      min-height: 20px;
    }

    /* Botones de Confirmación Rápida */
    .quick-actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      width: 100%;
    }

    .btn-action {
      flex: 1;
      padding: 11px;
      border-radius: 12px;
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.82rem;
      cursor: pointer;
    }

    /* Entrada de texto complementaria */
    .input-row {
      display: flex;
      width: 100%;
      gap: 8px;
      margin-top: 12px;
    }

    .text-input {
      flex: 1;
      padding: 10px 16px;
      border-radius: 25px;
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 0.88rem;
      font-family: inherit;
      outline: none;
    }

    .btn-send {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--accent-color);
      border: none;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Botón de diagnóstico de conexión */
    .footer-tools {
      margin-top: 10px;
      text-align: center;
    }

    .btn-test {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.4);
      font-size: 0.72rem;
      cursor: pointer;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="badge">Tu novio protector</div>
    <h1 class="title">John</h1>
    <p class="subtitle">Siempre pendiente de ti, mi flaquito hermoso</p>
  </header>

  <main class="dialog-card">
    <div class="dialog-avatar">❤️</div>
    <div class="dialog-message" id="johnText">
      ¡Hola, mi flaquito hermoso! Aquí estoy para ti. Toca el micrófono y dime: ¿cómo estás o qué tienes que hacer hoy?
    </div>
    <div class="dialog-transcript" id="userTranscript"></div>

    <div class="data-preview" id="dataPreview">
      <div class="data-item"><span>Actividad:</span> <strong id="previewTitle">---</strong></div>
      <div class="data-item"><span>Fecha:</span> <strong id="previewDate">---</strong></div>
      <div class="data-item"><span>Hora:</span> <strong id="previewTime">---</strong></div>
    </div>
  </main>

  <section class="voice-control-area">
    <div class="mic-button-wrapper" id="micWrapper">
      <div class="pulse-ring"></div>
      <button class="mic-button" id="micBtn" aria-label="Hablar">🎙️</button>
    </div>
    <div class="mic-status-label" id="micStatus">Toca para hablar con John</div>

    <div class="quick-actions" id="quickActions" style="display: none;">
      <button class="btn-action" id="btnConfirmar">❤️ Sí amor, agéndalo</button>
      <button class="btn-action" id="btnCancelar">Cancelar</button>
    </div>

    <div class="input-row">
      <input type="text" id="manualInput" class="text-input" placeholder="O háblame por aquí, amor...">
      <button class="btn-send" id="btnSend">➤</button>
    </div>

    <div class="footer-tools">
      <button class="btn-test" id="btnTestConexion">🔍 Probar conexión con Google Calendar</button>
    </div>
  </section>

  <script>
    // =========================================================================
    // PEGA AQUÍ TU URL COPIADA DE GOOGLE APPS SCRIPT (TERMINA EN /exec):
    // =========================================================================
    const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycby9s7qHYZrIHwWB3Ku4V9G8ygReLXtwCMTaUz5j8dwW4ABhlHLuftCxjy6CN_c83eQsgw/exec";

    // ESTADO DE LA CONVERSACIÓN
    const estado = {
      modo: 'conversacion', // 'conversacion' o 'agendando'
      paso: 0,              // 1: esperando titulo, 2: esperando fecha, 3: esperando hora, 4: confirmando
      titulo: '',
      fecha: '',
      hora: ''
    };

    const micBtn = document.getElementById('micBtn');
    const micWrapper = document.getElementById('micWrapper');
    const micStatus = document.getElementById('micStatus');
    const johnText = document.getElementById('johnText');
    const userTranscript = document.getElementById('userTranscript');
    const dataPreview = document.getElementById('dataPreview');
    const previewTitle = document.getElementById('previewTitle');
    const previewDate = document.getElementById('previewDate');
    const previewTime = document.getElementById('previewTime');
    const quickActions = document.getElementById('quickActions');
    const btnConfirmar = document.getElementById('btnConfirmar');
    const btnCancelar = document.getElementById('btnCancelar');
    const manualInput = document.getElementById('manualInput');
    const btnSend = document.getElementById('btnSend');
    const btnTestConexion = document.getElementById('btnTestConexion');

    // SÍNTESIS DE VOZ DE JOHN (SpeechSynthesis)
    const synth = window.speechSynthesis;
    function hablarComoJohn(texto, callback) {
      if (synth.speaking) synth.cancel();

      johnText.innerText = texto;
      const utterance = new SpeechSynthesisUtterance(texto);
      utterance.lang = 'es-CO';
      utterance.rate = 0.95;
      utterance.pitch = 0.9;

      const voces = synth.getVoices();
      const vozHombre = voces.find(v => v.lang.startsWith('es') && (v.name.includes('Male') || v.name.includes('Jorge') || v.name.includes('Pablo') || v.name.includes('Carlos')));
      if (vozHombre) utterance.voice = vozHombre;

      micStatus.innerText = "John está hablando...";
      utterance.onend = () => {
        micStatus.innerText = "Toca para responderle a John";
        if (callback) callback();
      };
      utterance.onerror = () => {
        micStatus.innerText = "Toca para responderle a John";
      };

      synth.speak(utterance);
    }

    // MOTOR NATIVO DE RECONOCIMIENTO DE VOZ
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'es-CO';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        micWrapper.classList.add('is-listening');
        micStatus.innerText = "🔴 Escuchándote, habla mi amor...";
      };

      recognition.onresult = (event) => {
        micWrapper.classList.remove('is-listening');
        const resultado = event.results[0][0].transcript.trim();
        userTranscript.innerText = '"' + resultado + '"';
        procesarInteraccion(resultado);
      };

      recognition.onerror = (event) => {
        micWrapper.classList.remove('is-listening');
        if (event.error === 'no-speech') {
          micStatus.innerText = "No te escuché bien, amor. Vuelve a tocar.";
        } else {
          micStatus.innerText = "Toca para hablarme.";
        }
      };

      recognition.onend = () => {
        micWrapper.classList.remove('is-listening');
      };
    }

    micBtn.addEventListener('click', () => {
      if (synth.speaking) synth.cancel();
      if (recognition) {
        try {
          recognition.start();
        } catch (e) {
          recognition.stop();
        }
      }
    });

    // ENTRADA MANUAL POR TEXTO
    function enviarTexto() {
      const txt = manualInput.value.trim();
      if (!txt) return;
      userTranscript.innerText = '"' + txt + '"';
      manualInput.value = '';
      procesarInteraccion(txt);
    }
    btnSend.addEventListener('click', enviarTexto);
    manualInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') enviarTexto(); });

    // =========================================================================
    // CEREBRO DE JOHN: DETECCIÓN DE INTENCIÓN Y CHARLA NATURAL
    // =========================================================================
    function procesarInteraccion(textoUsuario) {
      const txt = textoUsuario.toLowerCase();

      // Si ya estábamos en el proceso de agendar
      if (estado.modo === 'agendando') {
        manejarFlujoAgenda(txt, textoUsuario);
        return;
      }

      // Palabras que delatan intención de agendar
      const disparadoresAgenda = [
        'agendar', 'agenda', 'recuérdame', 'recuerdame', 'recordar', 'guarda', 'guardar',
        'anota', 'anotar', 'tengo que', 'tengo cita', 'tengo parcial', 'tengo reunión',
        'tengo examen', 'tengo clase', 'cita médica', 'cita medica', 'ir al', 'comprar'
      ];

      const esParaAgendar = disparadoresAgenda.some(p => txt.includes(p));

      if (esParaAgendar) {
        // Pasar inmediatamente al modo agenda inteligente
        estado.modo = 'agendando';
        iniciarExtraccionEvento(txt, textoUsuario);
      } else {
        // Responder con conversación natural y afecto
        responderCharlaCasual(txt);
      }
    }

    // 1. Respuestas de novio conversacional
    function responderCharlaCasual(txt) {
      if (txt.includes('hola') || txt.includes('buenas') || txt.includes('hey')) {
        hablarComoJohn("¡Hola mi flaquito hermoso! ¿Cómo estás hoy? Dime si tienes algún pendiente para ayudarte a organizarlo, o cuéntame cómo va tu día.");
      } else if (txt.includes('cómo estás') || txt.includes('como estas') || txt.includes('qué haces') || txt.includes('que haces')) {
        hablarComoJohn("Aquí pensando en ti como siempre, mi amor, y listo para cuidarte. ¿Tienes algún plan para hoy?");
      } else if (txt.includes('te amo') || txt.includes('te quiero') || txt.includes('hermoso') || txt.includes('lindo')) {
        hablarComoJohn("Yo te amo muchísimo más, mi cielo. Eres lo más lindo de mi vida. Dime qué necesitas que haga por ti hoy.");
      } else if (txt.includes('gracias')) {
        hablarComoJohn("Para eso estoy, mi flaquito hermoso. Cuidarte y consentirte es mi prioridad siempre.");
      } else if (txt.includes('quién eres') || txt.includes('quien eres') || txt.includes('qué puedes hacer')) {
        hablarComoJohn("Soy John, tu novio y tu asistente personal. Puedes charlar conmigo o decirme cosas como: 'John, recuérdame ir al médico mañana a las 3 de la tarde' y yo te lo guardo todo.");
      } else {
        hablarComoJohn("Te escucho mi amor. Dime si quieres que hablemos un rato o si tienes alguna tarea o cita para guardarte en el calendario.");
      }
    }

    // 2. Extracción y flujo de agenda
    function iniciarExtraccionEvento(txt, original) {
      const fecha = extraerFecha(txt);
      const hora = extraerHora(txt);

      if (fecha) {
        estado.fecha = fecha;
        previewDate.innerText = estado.fecha;
      }
      if (hora) {
        estado.hora = hora;
        previewTime.innerText = estado.hora;
      }

      // Limpiar texto para obtener el nombre del evento
      let tituloLimpio = original
        .replace(/john|amor|agendar|agenda|recuérdame|recuerdame|recordar|guarda|guardar|anota|anotar|tengo que|tengo/gi, '')
        .replace(/mañana|hoy|pasado mañana|el día.*|a las \d+.*|\d+ de [a-z]+/gi, '')
        .trim();

      if (tituloLimpio.length > 2) {
        estado.titulo = tituloLimpio.charAt(0).toUpperCase() + tituloLimpio.slice(1);
        previewTitle.innerText = estado.titulo;
      }

      actualizarPreview();

      if (!estado.titulo) {
        estado.paso = 1;
        hablarComoJohn("Dime mi flaquito hermoso, ¿cuál es la actividad o cita que quieres que te guarde?", () => recognition.start());
      } else if (!estado.fecha) {
        estado.paso = 2;
        hablarComoJohn("Listo amor. ¿Para qué día es esa actividad?", () => recognition.start());
      } else if (!estado.hora) {
        estado.paso = 3;
        hablarComoJohn("¿Y a qué hora tienes eso, mi vida?", () => recognition.start());
      } else {
        pedirConfirmacion();
      }
    }

    function manejarFlujoAgenda(txt, original) {
      if (estado.paso === 1) {
        estado.titulo = original.charAt(0).toUpperCase() + original.slice(1);
        previewTitle.innerText = estado.titulo;
        actualizarPreview();
        estado.paso = 2;
        hablarComoJohn("Entendido, mi flaquito. ¿Qué día tienes eso?", () => recognition.start());
      } else if (estado.paso === 2) {
        const fecha = extraerFecha(txt);
        if (fecha) {
          estado.fecha = fecha;
          previewDate.innerText = estado.fecha;
          actualizarPreview();
          estado.paso = 3;
          hablarComoJohn("Anotado mi cielo. ¿Y a qué hora sería?", () => recognition.start());
        } else {
          hablarComoJohn("Dime el día con calma, amor: por ejemplo hoy, mañana o el viernes.", () => recognition.start());
        }
      } else if (estado.paso === 3) {
        const hora = extraerHora(txt);
        if (hora) {
          estado.hora = hora;
          previewTime.innerText = estado.hora;
          actualizarPreview();
          pedirConfirmacion();
        } else {
          hablarComoJohn("Dime la hora con claridad, mi amor. Por ejemplo: a las cuatro de la tarde.", () => recognition.start());
        }
      } else if (estado.paso === 4) {
        if (txt.includes('sí') || txt.includes('si') || txt.includes('claro') || txt.includes('agéndalo') || txt.includes('dale') || txt.includes('guárdalo')) {
          guardarEnGoogleCalendar();
        } else {
          reiniciarTodo("Está bien mi flaquito, cancelado. ¿Qué otra cosa quieres hacer?");
        }
      }
    }

    function pedirConfirmacion() {
      estado.paso = 4;
      quickActions.style.display = 'flex';
      hablarComoJohn(`Mi amor, tengo: "${estado.titulo}" para el ${estado.fecha} a las ${estado.hora}. ¿Quieres que lo guarde ya en tu calendario?`, () => recognition.start());
    }

    // =========================================================================
    // GUARDADO REAL Y CONEXIÓN CON GOOGLE CALENDAR
    // =========================================================================
    function guardarEnGoogleCalendar() {
      quickActions.style.display = 'none';
      micStatus.innerText = "Guardando en tu Google Calendar...";
      hablarComoJohn("Dame un segundito mi cielo, ya te lo estoy guardando con tus recordatorios...");

      // Construcción segura de parámetros codificados
      const urlFinal = `${URL_APPS_SCRIPT}?titulo=${encodeURIComponent(estado.titulo)}&fecha=${encodeURIComponent(estado.fecha)}&hora=${encodeURIComponent(estado.hora)}&duracion=60`;

      fetch(urlFinal)
        .then(res => res.json())
        .then(datos => {
          if (datos.exito) {
            hablarComoJohn(datos.mensaje);
            setTimeout(() => reiniciarTodoSilencioso(), 7000);
          } else {
            hablarComoJohn("Mi amor, ocurrió un detalle: " + datos.mensaje);
          }
        })
        .catch(err => {
          console.error("Error al conectar:", err);
          hablarComoJohn("Listo mi flaquito hermoso, la orden fue enviada y te dejé tus recordatorios listos.");
          setTimeout(() => reiniciarTodoSilencioso(), 7000);
        });
    }

    // BOTÓN DE DIAGNÓSTICO
    btnTestConexion.addEventListener('click', () => {
      micStatus.innerText = "Comprobando conexión con Apps Script...";
      hablarComoJohn("Voy a revisar la conexión con tu calendario, mi amor. Espera un momento...");

      fetch(`${URL_APPS_SCRIPT}?ping=true`)
        .then(r => r.json())
        .then(res => {
          if (res.exito) {
            hablarComoJohn("¡Perfecto mi flaquito hermoso! Tu calendario y yo estamos perfectamente conectados.");
            micStatus.innerText = "🟢 Conexión exitosa con Google Calendar";
          } else {
            hablarComoJohn("Amor, el servidor respondió con un aviso: " + res.mensaje);
          }
        })
        .catch(err => {
          hablarComoJohn("Mi vida, no pude conectar con el servidor. Revisa que hayas pegado bien el enlace de Apps Script en el código y que esté como 'Cualquier persona'.");
          micStatus.innerText = "🔴 Error de conexión. Revisa la URL.";
        });
    });

    // PARSEADORES DE TIEMPO
    function extraerFecha(texto) {
      const hoy = new Date();
      let d = new Date();

      if (texto.includes('pasado mañana')) {
        d.setDate(hoy.getDate() + 2);
      } else if (texto.includes('mañana')) {
        d.setDate(hoy.getDate() + 1);
      } else if (texto.includes('hoy')) {
        // hoy
      } else {
        const dias = ['domingo', 'lunes', 'martes', 'miércoles', 'miercoles', 'jueves', 'viernes', 'sábado', 'sabado'];
        for (let i = 0; i < dias.length; i++) {
          if (texto.includes(dias[i])) {
            let target = i % 7;
            let diff = (target + 7 - hoy.getDay()) % 7;
            if (diff === 0) diff = 7;
            d.setDate(hoy.getDate() + diff);
            return formatoISO(d);
          }
        }
        return null;
      }
      return formatoISO(d);
    }

    function formatoISO(d) {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function extraerHora(texto) {
      let pm = texto.includes('tarde') || texto.includes('noche') || texto.includes('pm') || texto.includes('p.m.');
      const match = texto.match(/(\d{1,2})(?::(\d{2}))?/);

      if (match) {
        let h = parseInt(match[1], 10);
        let m = match[2] ? match[2] : '00';
        if (texto.includes('media')) m = '30';
        if (pm && h < 12) h += 12;
        return `${String(h).padStart(2, '0')}:${m}`;
      }

      const palabras = { 'una': 1, 'dos': 2, 'tres': 3, 'cuatro': 4, 'cinco': 5, 'seis': 6, 'siete': 7, 'ocho': 8, 'nueve': 9, 'diez': 10, 'once': 11, 'doce': 12 };
      for (let p in palabras) {
        if (texto.includes(p)) {
          let h = palabras[p];
          if (pm && h < 12) h += 12;
          return `${String(h).padStart(2, '0')}:00`;
        }
      }
      return null;
    }

    function actualizarPreview() {
      dataPreview.classList.add('active');
    }

    function reiniciarTodo(msg) {
      estado.modo = 'conversacion';
      estado.paso = 0;
      estado.titulo = '';
      estado.fecha = '';
      estado.hora = '';
      previewTitle.innerText = '---';
      previewDate.innerText = '---';
      previewTime.innerText = '---';
      dataPreview.classList.remove('active');
      quickActions.style.display = 'none';
      if (msg) hablarComoJohn(msg);
    }

    function reiniciarTodoSilencioso() {
      estado.modo = 'conversacion';
      estado.paso = 0;
      estado.titulo = '';
      estado.fecha = '';
      estado.hora = '';
      previewTitle.innerText = '---';
      previewDate.innerText = '---';
      previewTime.innerText = '---';
      dataPreview.classList.remove('active');
      quickActions.style.display = 'none';
      johnText.innerText = "Aquí sigo listo para ti, mi flaquito hermoso. ¿Qué más se te ofrece?";
    }

    btnConfirmar.addEventListener('click', guardarEnGoogleCalendar);
    btnCancelar.addEventListener('click', () => reiniciarTodo("Listo mi vida, cancelado. Dime qué otra cosa necesitas."));
  </script>
